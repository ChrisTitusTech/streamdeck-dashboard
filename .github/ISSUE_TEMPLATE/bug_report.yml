name: Bug report
description: Report a reproducible problem with the Codex Status action
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not attach Codex transcripts, credentials, or unrelated source files.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: opendeck-version
    attributes:
      label: OpenDeck version
      placeholder: 2.13.1
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: v24.13.1
    validations:
      required: true
  - type: input
    id: linux
    attributes:
      label: Linux distribution
      placeholder: Fedora 44
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected key state.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start OpenDeck
        2. Start a local Codex task
        3. Observe the key
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant plugin log lines
      description: Remove private paths and sensitive data before posting.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I confirmed Node.js 18 or newer is installed on the host.
          required: true
        - label: I removed transcripts, credentials, and other private data.
          required: true
