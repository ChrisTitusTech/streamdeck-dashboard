name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      - name: Validate and test
        run: |
          npm run check
          npm test

      - name: Build release package
        run: npm run package

      - name: Verify archive and write checksum
        run: |
          unzip -t release/*.streamDeckPlugin
          cd release
          sha256sum -- ./*.streamDeckPlugin > "codex-status-${GITHUB_REF_NAME}.streamDeckPlugin.sha256"

      - name: Attest release package
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/*.streamDeckPlugin

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            release/*.streamDeckPlugin
            release/*.sha256
          generate_release_notes: true
