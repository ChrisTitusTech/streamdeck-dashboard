<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-labelledby="title description">
  <title id="title">Codex Status button states</title>
  <desc id="description">Working, complete, and offline Codex status buttons for OpenDeck.</desc>
  <rect width="720" height="260" rx="20" fill="#09090b"/>
  <g transform="translate(46 50)">
    <rect width="160" height="160" rx="16" fill="#18181b"/>
    <circle cx="80" cy="38" r="18" fill="none" stroke="#f59e0b" stroke-width="5"/>
    <path d="M70 38h20M80 28v20" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <text x="80" y="75" fill="#a1a1aa" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">CODEX</text>
    <text x="80" y="108" fill="#f59e0b" font-family="sans-serif" font-size="21" font-weight="800" text-anchor="middle">WORKING</text>
    <text x="80" y="135" fill="#d4d4d8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">1 ACTIVE TASK</text>
  </g>
  <g transform="translate(280 50)">
    <rect width="160" height="160" rx="16" fill="#18181b"/>
    <circle cx="80" cy="38" r="18" fill="none" stroke="#22c55e" stroke-width="5"/>
    <path d="M70 38h20M80 28v20" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
    <text x="80" y="75" fill="#a1a1aa" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">CODEX</text>
    <text x="80" y="108" fill="#22c55e" font-family="sans-serif" font-size="21" font-weight="800" text-anchor="middle">COMPLETE</text>
    <text x="80" y="135" fill="#d4d4d8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">CODEX READY</text>
  </g>
  <g transform="translate(514 50)">
    <rect width="160" height="160" rx="16" fill="#18181b"/>
    <circle cx="80" cy="38" r="18" fill="none" stroke="#71717a" stroke-width="5"/>
    <path d="M70 38h20M80 28v20" stroke="#71717a" stroke-width="4" stroke-linecap="round"/>
    <text x="80" y="75" fill="#a1a1aa" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">CODEX</text>
    <text x="80" y="108" fill="#71717a" font-family="sans-serif" font-size="21" font-weight="800" text-anchor="middle">OFFLINE</text>
    <text x="80" y="135" fill="#d4d4d8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">NO PROCESS</text>
  </g>
</svg>
